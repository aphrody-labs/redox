[source]
# Bun OS: aphrody-labs fork, pinned (upstream https://gitlab.redox-os.org/redox-os/orbutils.git)
git = "https://github.com/aphrody-labs/orbutils.git"
upstream = "https://gitlab.redox-os.org/redox-os/orbutils.git"
rev = "b1fe594838873852c49d14f0b50f5902c6ed72f0"
[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/share/ui"
cp -rv "${COOKBOOK_SOURCE}/apps" "${COOKBOOK_STAGE}/usr/share/ui/apps"

COOKBOOK_CARGO_PATH="orbutils" cookbook_cargo
COOKBOOK_CARGO_PATH="launcher" cookbook_cargo
"""
