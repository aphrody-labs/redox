[source]
# Bun OS: aphrody-labs fork, pinned (upstream https://gitlab.redox-os.org/redox-os/relibc.git)
git = "https://github.com/aphrody-labs/relibc.git"
upstream = "https://gitlab.redox-os.org/redox-os/relibc.git"
rev = "ad0c4794e522e35533d6e177fd5d1825e6491078"
[build]
template = "custom"
compiler = "gcc-no-lto"
script = """
# rustup workaround https://github.com/rust-lang/rustup/issues/988
if [ "${COOKBOOK_HOST_SYSROOT}" = "/usr" ]; then
if command -v rustup >/dev/null 2>&1; then
    pushd ${COOKBOOK_SOURCE}
    ${RUSTUP:-rustup} install
    popd
fi
fi

export CARGO=${CARGO:-env -u CARGO cargo}
"${COOKBOOK_MAKE}" \
    -C "${COOKBOOK_SOURCE}" \
    -j"${COOKBOOK_MAKE_JOBS}" \
    DESTDIR="${COOKBOOK_STAGE}/usr" \
    install
"""
