[source]
# Bun OS: aphrody-labs fork, pinned (upstream https://github.com/pop-os/cosmic-text.git)
git = "https://github.com/aphrody-labs/cosmic-text.git"
upstream = "https://github.com/pop-os/cosmic-text.git"
rev = "f1a3461f3e8df67d2bbcfafb8bc61dc7aee5b2a6"
[build]
template = "custom"
dependencies = [
    "libonig",
]
script = """
DYNAMIC_INIT
export RUSTONIG_DYNAMIC_LIBONIG=1
COOKBOOK_CARGO_FLAGS=() # remove --locked
COOKBOOK_CARGO_PATH=examples/editor cookbook_cargo_build
"""

[package]
dependencies = [
    "libxkbcommon",
]
